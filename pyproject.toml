[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lumbar-rehab-assistant"
version = "0.1.0"
description = "Windows desktop application framework for the lumbar rehabilitation assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.8.3"]

[project.optional-dependencies]
packaging = ["PyInstaller==6.11.1"]

[project.scripts]
rehab-assistant = "rehab_assistant.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rehab_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
